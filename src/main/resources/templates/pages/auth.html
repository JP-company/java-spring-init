<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header/common :: head}"></head>

<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg mt-5 p-4">
          <h1 class="text-center mb-4" style="font-size: 1.5rem; font-weight: bold;">로그인</h1>

          <div id="step">
            <form id="emailForm" hx-post="/view/v1/auth/email/code" hx-ext="json-enc" hx-encoding="application/json">
              <div class="mb-3">
                <input type="email" class="form-control form-control-lg" name="email" placeholder="이메일 입력" required
                  style="font-size: 1.2rem;">
              </div>
              <button type="submit" class="btn btn-primary w-100 btn-lg" style="font-size: 1.2rem;">인증 코드 받기</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
