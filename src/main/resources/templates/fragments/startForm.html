<div id="step">
    <form hx-post="/view/v1/account" hx-target="#step" hx-swap="outerHTML" hx-ext="json-enc">
        <label><input type="email" name="email" th:value="${email}" readonly></label>
        <label><input type="text" name="authCode" th:value="${authCode}" readonly></label>
        <label><input type="text" name="nickname" placeholder="닉네임 입력" required></label>
        <button type="submit">회원가입</button>
    </form>
</div>
